<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ZENO Phone</title><style>
:root{color-scheme:dark;--a:#78aaff;--p:#101522;--d:#94a2bd}*{box-sizing:border-box}body{margin:0;background:#060912;color:#edf2ff;font:16px system-ui;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}main{max-width:550px;margin:auto}.head{display:flex;align-items:center;gap:12px}.orb{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e4edff,#719bff 35%,#292b82 72%);box-shadow:0 0 24px #618eff;animation:pulse 3s ease-in-out infinite}.status{margin-left:auto;color:var(--d);font-size:13px}.card{margin:15px 0;padding:16px;border:1px solid #283453;border-radius:17px;background:var(--p)}input,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #35476f}input{width:100%;background:#080d19;color:white;margin:8px 0}button{background:var(--a);color:#07101f;border:0;font-weight:700;cursor:pointer}button.secondary{background:#212b41;color:#eaf1ff}.row{display:flex;gap:8px}.row>*{flex:1}#app,#pairing,#login{display:none}.log{max-height:42vh;overflow:auto}.msg{padding:10px;margin:8px 0;border-radius:12px;background:#182038;white-space:pre-wrap}.me{background:#5477c3;color:#061027;margin-left:16%}.mic{width:55px;border-radius:50%;font-size:22px}.recording{background:#e85668}@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 34px #729cff}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}</style></head><body><main>
<div class="head"><div class="orb"></div><div><b>ZENO</b><br><small>Phone Companion</small></div><span class="status" id="status">Connecting…</span></div>
<section id="pairing" class="card"><h2>Pair this phone</h2><p>Your phone will ask for its normal device verification. ZENO never receives biometric data.</p><input id="name" maxlength="64" placeholder="Device name"><button id="pair">Verify this device</button><p id="pair-note"></p></section>
<section id="login" class="card"><h2>Unlock ZENO</h2><p>Use this phone's passkey to continue.</p><button id="unlock">Verify and unlock</button><p id="login-note"></p></section>
<section id="app"><div class="card"><b id="task">ZENO is ready</b><p id="scope" style="color:var(--d)"></p><div class="row"><button class="secondary" id="lock">Lock</button><button class="secondary" id="disconnect">Disconnect</button></div></div><div class="card log" id="log"></div><div class="row"><button class="mic" id="mic" aria-label="Tap to talk">🎙</button><input id="message" placeholder="Talk to ZENO…"><button id="send">Send</button></div><p id="voice" style="color:var(--d)"></p></section>
</main><script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),token=params.get('token')||params.get('code');let csrf='',device=localStorage.getItem('zeno_phone_device')||'',rec;
function note(id,t){$(id).textContent=t}function b64(b){return b.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(b.length/4)*4,'=')}function bytes(v){return Uint8Array.from(atob(b64(v)),c=>c.charCodeAt(0))}function options(o){if(o.challenge)o.challenge=bytes(o.challenge);for(const k of ['user','allowCredentials','excludeCredentials']){if(o[k]?.id)o[k].id=bytes(o[k].id);if(Array.isArray(o[k]))o[k].forEach(x=>x.id&&(x.id=bytes(x.id)))}return o}function credential(c){const r={id:c.id,rawId:btoa(String.fromCharCode(...new Uint8Array(c.rawId))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),type:c.type,response:{}};for(const[k,v]of Object.entries(c.response))if(v instanceof ArrayBuffer)r.response[k]=btoa(String.fromCharCode(...new Uint8Array(v))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');return r}
async function api(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Zeno-CSRF':csrf},body:JSON.stringify(data)});let d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function pair(){try{let o=await api('/api/phone/pair/options',{token,name:$('name').value.trim()||'My phone'}),challenge=o.challenge;let c=await navigator.credentials.create({publicKey:options(o)});let d=await api('/api/phone/pair/complete',{credential:credential(c),challenge});note('pair-note','Awaiting approval on your ZENO computer.');device=d.device_id;localStorage.setItem('zeno_phone_device',device)}catch(e){note('pair-note',e.message)}}
async function unlock(){try{let o=await api('/api/phone/login/options',{device_id:device}),challenge=o.challenge;let c=await navigator.credentials.get({publicKey:options(o)});let d=await api('/api/phone/login/complete',{credential:credential(c),challenge});csrf=d.csrf;showApp()}catch(e){note('login-note',e.message)}}
async function showApp(){let s=await fetch('/api/phone/status').then(r=>r.json());$('scope').textContent='Connected as '+s.device+' • '+s.scopes.join(', ');$('login').style.display='none';$('app').style.display='block';$('status').textContent='ZENO connected'}
function add(t,me=false){let x=document.createElement('div');x.className='msg'+(me?' me':'');x.textContent=t;$('log').append(x);x.scrollIntoView()}async function send(text){if(!text)return;add(text,true);$('message').value='';try{let d=await api('/api/phone/command',{command_id:crypto.randomUUID(),nonce:crypto.randomUUID(),timestamp:Date.now()/1000,message:text});let reply=d.response.response||d.response.text||JSON.stringify(d.response);add(reply);if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)speechSynthesis.speak(new SpeechSynthesisUtterance(reply))}catch(e){add('ZENO: '+e.message)}}
$('pair').onclick=pair;$('unlock').onclick=unlock;$('send').onclick=()=>send($('message').value);$('message').onkeydown=e=>e.key==='Enter'&&send($('message').value);$('lock').onclick=()=>location.reload();$('disconnect').onclick=()=>{localStorage.removeItem('zeno_phone_device');location.href='/phone'};
$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){note('voice','Tap-to-talk is not supported by this browser. Use text instead.');return}if(rec){rec.stop();return}rec=new SR();rec.continuous=false;rec.lang='en-US';$('mic').classList.add('recording');rec.onresult=e=>send(e.results[0][0].transcript);rec.onend=()=>{rec=null;$('mic').classList.remove('recording')};rec.onerror=()=>note('voice','Microphone permission was unavailable; use text instead.');rec.start()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&rec)rec.stop()});(async()=>{if(token){$('pairing').style.display='block';$('status').textContent='Pairing link open'}else if(device){$('login').style.display='block';$('status').textContent='Verification required'}else{$('pairing').style.display='block';note('pair-note','Open a current QR pairing link from ZENO desktop settings.')}})();
</script></body></html>
