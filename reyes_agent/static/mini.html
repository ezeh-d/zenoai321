<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZENO Mini Orb</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#dcecff;font:11px system-ui,sans-serif;cursor:grab;user-select:none}
  body.dragging{cursor:grabbing} #orb-simple{width:130px!important;height:130px!important} #orb-canvas{position:fixed;inset:0;width:100%;height:100%}
  #music-card{display:none;position:fixed;left:8px;right:8px;bottom:6px;z-index:4;align-items:center;gap:5px;padding:4px 6px;border-radius:8px;background:rgba(5,12,26,.86);border:1px solid rgba(98,200,255,.45);font-size:9px;pointer-events:none}#music-card.show{display:flex}#music-art{width:20px;height:20px;border-radius:4px;object-fit:cover;display:none}
</style></head><body><canvas id="orb-canvas"></canvas><div id="music-card"><img id="music-art" alt=""><span id="music-text"></span></div>
<script type="module">
import { initOrb } from '/static/orb.js';
import * as voiceVAD from '/static/vad.js?v=1';
import { createAgentPresence } from '/static/agent_presence.js';
const orb=initOrb(document.getElementById('orb-canvas'));
// This is still ONE native Mini Orb window. Specialist faces are small DOM
// children created only for real Event Bus lifecycle events; they are never
// separate floating windows and disappear after the real terminal event.
const agentPresence=createAgentPresence({container:document.body,mode:'mini'});
// Mini Orb shares the same persisted eye preference. It tracks pointer motion
// inside its own lightweight WebView only; no native global-mouse hook or
// high-frequency bridge is introduced just for decoration.
function applyMiniEyeSettings(settings){if(orb.setEyeTracking)orb.setEyeTracking({enabled:!!settings.cursor_eye_tracking,fps:settings.eye_tracking_fps||'auto',performanceMode:settings.performance_mode||'auto'});}
fetch('/api/performance-features/settings').then(r=>r.ok?r.json():null).then(data=>{if(data)applyMiniEyeSettings(data.settings||{});}).catch(()=>{});
function api(){return window.pywebview&&window.pywebview.api;}
function openDashboard(){
  // There must be one capture owner at a time.  The native host publishes a
  // matching lifecycle event, and restores this listener after the dashboard
  // is hidden again.
  stopWakeListener();
  const a=api();if(a&&a.show_dashboard)a.show_dashboard();else location.href='/';
}
async function refresh(){
  try{const data=await(await fetch('/api/mini-status')).json(),task=data.task||{},progress=task.progress||{},workflow=data.workflow||{},mode=workflow.mode||'NORMAL';
    const elapsed=task.run_ms?` · ${Math.floor(task.run_ms/1000)}s`:'';
    const agent=data.agents&&data.agents[0]?` · ${data.agents[0]}`:'';
    const text=task.name?`${task.name} · ${progress.stage||'working'}${elapsed}${agent}`:'ZENO · idle';
    document.title=text;
    const stage=String(progress.stage||'').toLowerCase();
    if(mode==='WORKFLOW_FAILED'||mode==='WORKFLOW_CANCELLED')orb.setState('error');
    else if(mode==='WORKFLOW_COMPLETED')orb.setState('success');
    else if(mode==='WORKFLOW_WAITING_FOR_INPUT'||mode==='WORKFLOW_WAITING_FOR_CONFIRMATION')orb.setState('waiting');
    else if(mode==='WORKFLOW_RUNNING')orb.setState('acting');
    else if(mode==='TEACH_MODE_STARTING'||mode==='TEACH_MODE_REVIEW')orb.setState('understanding');
    else if(mode.startsWith('TEACH_MODE_'))orb.setState('listening');
    else if(/listen|speech|transcrib/.test(stage))orb.setState('listening');
    else if(/understand|plan|verif/.test(stage))orb.setState('understanding');
    else if(/think|reason|process/.test(stage))orb.setState('thinking');
    else if(/wait|queue/.test(stage)||(!task.name&&data.queue_depth))orb.setState('waiting');
    else if(task.name||data.active_count||data.agents?.length)orb.setState('acting');
    else orb.setState('idle');
    // The endpoint is only a late-connection bootstrap. Live transitions
    // below are driven by the Event Bus, not a polling animation.
    agentPresence.bootstrap(data.agents);
  }catch(_e){/* Preserve the last honest state during a transient local request failure. */}
}
refresh();setInterval(()=>{if(!document.hidden)refresh();},2000);
// A compact SSE subscription gives the Mini Orb the exact same real agent
// lifecycle as the dashboard. It is one dormant socket, not a polling loop.
let agentEventSource=null;
if(window.EventSource){
  agentEventSource=new EventSource('/api/events/stream');
  agentEventSource.onmessage=(event)=>{try{
    const update=JSON.parse(event.data);
    agentPresence.consume(update);
    if(update.type==='performance.features_changed')applyMiniEyeSettings(update.payload||{});
    if(update.type==='audio.recognized')showRecognizedAudio(update.payload||{});
    // The dashboard's native close/minimize event is the handoff point for
    // the single microphone stream.  Delay only the reacquire, so the hidden
    // dashboard has time to release its track first; this never shows a new
    // permission prompt for an already-granted persistent WebView2 profile.
    if(update.type==='desktop.dashboard_opened')stopWakeListener();
    if(update.type==='desktop.dashboard_hidden')setTimeout(()=>{if(!wakeActive)void startWakeListener();},700);
  }catch(_e){}};
}
let musicHideTimer=null;
function showRecognizedAudio(payload){const card=document.getElementById('music-card'),text=document.getElementById('music-text'),art=document.getElementById('music-art');if(!card||!text)return;if(payload.matched){text.textContent=`${payload.artist||''} — ${payload.title||''}`.replace(/^\s*—\s*/, '');if(payload.artwork_url){art.src=payload.artwork_url;art.style.display='block';}else art.style.display='none';}else{text.textContent='Audio not identified';art.style.display='none';}card.classList.add('show');clearTimeout(musicHideTimer);musicHideTimer=setTimeout(()=>card.classList.remove('show'),12000);}
let dragging=false,moved=false,startX=0,startY=0,moveInFlight=false,queuedMove=null;
function flushMove(){
  if(moveInFlight||!queuedMove)return;
  const point=queuedMove;queuedMove=null;const a=api();
  if(!a||(typeof a.move_orb_drag!=='function'&&typeof a.move_window!=='function'))return;
  moveInFlight=true;
  const move=typeof a.move_orb_drag==='function'?a.move_orb_drag(point.screenX,point.screenY):a.move_window(point.screenX,point.screenY);
  Promise.resolve(move).catch(()=>{}).finally(()=>{moveInFlight=false;if(queuedMove)requestAnimationFrame(flushMove);});
}
document.addEventListener('mousedown',e=>{const a=api();if(!a)return;dragging=true;moved=false;startX=e.screenX;startY=e.screenY;document.body.classList.add('dragging');if(a.begin_orb_drag)a.begin_orb_drag(e.screenX,e.screenY,window.outerWidth||210).catch(()=>{});});
document.addEventListener('mousemove',e=>{if(!dragging)return;const dx=e.screenX-startX,dy=e.screenY-startY;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;queuedMove={screenX:e.screenX,screenY:e.screenY};requestAnimationFrame(flushMove);});
document.addEventListener('mouseup',()=>{if(!dragging)return;dragging=false;document.body.classList.remove('dragging');const a=api();if(a){const end=a.end_orb_drag||a.snap_orb;if(end)Promise.resolve(end.call(a)).catch(()=>{});}});
document.addEventListener('click',()=>{if(!moved)openDashboard();});
window.addEventListener('pywebviewready',()=>{const a=api();if(a&&a.restore_orb_position)a.restore_orb_position().catch(()=>{});});
// One awaited heartbeat per second proves that WebView messages are crossing
// into the Python host. It is never tied to animation frames and cannot
// accumulate bridge calls while the host is delayed.
setInterval(async()=>{const a=api();if(!document.hidden&&a&&a.host_heartbeat){try{await a.host_heartbeat(Date.now()/1000);}catch(_e){}}},1000);
// The compact companion uses the same *processed* microphone stream as the
// dashboard. A second Web Speech capture here would bypass VAD/noise
// suppression and produce a second permission/session inside one WebView.
let wakeRecorder=null,wakeChunks=[],wakeTimer=null,wakeActive=false,wakeBusy=false,wakeDiscard=false,wakeRecoveryTimer=null,wakeRecoveryAttempts=0,miniListeningUntil=0,miniReplyAudio=null;
let WAKE_MAX_CLIP_MS=12_000,TRANSCRIBE_TIMEOUT_MS=12_000;const WAKE_MIN_CLIP_BYTES=1_200;let speechSettingsPromise=null;
const MIC_DEVICE_STORAGE='zeno.selectedMicrophoneId'; let miniAudioProved=false;
function selectedMicrophoneId(){return localStorage.getItem(MIC_DEVICE_STORAGE)||'';}
function loadSpeechSettings(){if(speechSettingsPromise)return speechSettingsPromise;speechSettingsPromise=(async()=>{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),2000);try{const response=await fetch('/api/speech/capabilities',{signal:controller.signal}),payload=await response.json(),settings=payload.settings||{};voiceVAD.configure(settings);WAKE_MAX_CLIP_MS=Number(settings.max_utterance_ms)||WAKE_MAX_CLIP_MS;TRANSCRIBE_TIMEOUT_MS=Number(settings.transcribe_timeout_ms)||TRANSCRIBE_TIMEOUT_MS;}catch(_e){voiceVAD.configure({});}finally{clearTimeout(timer);}})();return speechSettingsPromise;}
function reportMiniMic(status,detail='',audioReceived=false){return fetch('/api/microphone/runtime',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,detail,source:'mini-orb',audio_received:audioReceived,device_id:voiceVAD.capabilities().device_id||selectedMicrophoneId()})}).catch(()=>null);}
function recorderOptions(){const types=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];const mimeType=types.find(t=>MediaRecorder.isTypeSupported(t));return mimeType?{mimeType}:undefined;}
function finishWakeClip(discard=false){if(!wakeRecorder)return;wakeDiscard=wakeDiscard||discard;if(wakeTimer){clearTimeout(wakeTimer);wakeTimer=null;}if(wakeRecorder.state!=='inactive')wakeRecorder.stop();}
function miniWakeCommand(transcript){const match=/\b(?:wake up zeno|hey zeno|zeno)\b/i.exec(transcript);if(match)return transcript.slice(0,match.index).concat(' ',transcript.slice(match.index+match[0].length)).trim();return null;}
function isOpenZenoCommand(text){return /^(?:open|show)\s+(?:the\s+)?(?:zeno|dashboard|main\s+(?:app|window))\b/i.test(text);}
async function speakMiniReply(text){if(!text)return;voiceVAD.pauseDetection();orb.setState('speaking');document.title='ZENO Mini Orb · SPEAKING';try{const res=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,agent:'zeno'})});if(!res.ok)throw Error('tts unavailable');const url=URL.createObjectURL(await res.blob());const audio=new Audio(url);miniReplyAudio=audio;await new Promise(resolve=>{audio.onended=resolve;audio.onerror=resolve;audio.play().catch(resolve);});URL.revokeObjectURL(url);}catch(_e){document.title='ZENO Mini Orb · REPLY READY';}finally{miniReplyAudio=null;if(wakeActive)voiceVAD.resumeDetection();}}
async function runMiniCommand(message,data){if(!message)return;orb.setState('thinking');document.title='ZENO Mini Orb · THINKING';if(/\b(?:recalibrate|calibrate|adjust)\s+(?:the\s+)?(?:microphone|mic|listening sensitivity)\b/i.test(message)){voiceVAD.recalibrate();await speakMiniReply('Microphone sensitivity adjusted.');return;}if(isOpenZenoCommand(message)){openDashboard();return;}const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,voice_identity:data.speaker||null,voice_identity_proof:String(data.speaker_proof||''),turn_kind:'voice'})});const reply=await res.json().catch(()=>({}));if(!res.ok)throw Error(String(reply.detail||'command failed'));const text=String(reply.reply||'').trim();if(text){orb.setState('success');await speakMiniReply(text);}}
async function transcribeWakeClip(blob,speakerBlob=null){if(!wakeActive||wakeBusy)return;if(blob.size<WAKE_MIN_CLIP_BYTES){orb.setState('idle');document.title='ZENO Mini Orb · MIC LISTENING';return;}wakeBusy=true;orb.setState('processing');const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),TRANSCRIBE_TIMEOUT_MS);try{const form=new FormData();form.append('audio',blob,'zeno-wake.webm');if(speakerBlob&&speakerBlob.size)form.append('speaker_audio',speakerBlob,'zeno-speaker.wav');const res=await fetch('/api/transcribe',{method:'POST',body:form,signal:controller.signal});const data=await res.json().catch(()=>({}));if(data.speaker&&data.speaker.status)document.title='ZENO Mini Orb · '+data.speaker.status.replace(/_/g,' ').toLowerCase();if(!res.ok)throw Error(String(data.detail||'transcription failed'));const transcript=String(data.transcript||'').trim();if(!transcript)return;const afterWake=miniWakeCommand(transcript);const command=afterWake===null?(Date.now()<miniListeningUntil?transcript:''):afterWake;miniListeningUntil=Date.now()+30000;if(command){await runMiniCommand(command,data);}else if(afterWake!==null){orb.setState('listening');document.title='ZENO Mini Orb · LISTENING';await speakMiniReply("I'm listening.");}}catch(error){orb.setState('error');document.title=error&&error.name==='AbortError'?'ZENO Mini Orb · TRANSCRIPTION TIMEOUT':'ZENO Mini Orb · VOICE ERROR';}finally{clearTimeout(timeout);wakeBusy=false;if(wakeActive)orb.setState('idle');}}
function startWakeClip(){if(!wakeActive||wakeBusy||wakeRecorder)return;const stream=voiceVAD.mediaStream();if(!stream)return;wakeChunks=[];wakeDiscard=false;voiceVAD.beginPcmCapture();try{const recorder=new MediaRecorder(stream,recorderOptions());wakeRecorder=recorder;recorder.ondataavailable=e=>{if(e.data&&e.data.size)wakeChunks.push(e.data);};recorder.onstop=()=>{if(wakeTimer){clearTimeout(wakeTimer);wakeTimer=null;}const chunks=wakeChunks,discard=wakeDiscard;wakeChunks=[];wakeDiscard=false;if(wakeRecorder===recorder)wakeRecorder=null;const pcm=voiceVAD.endPcmCapture();if(!discard)void transcribeWakeClip(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}),pcm);};recorder.start(250);wakeTimer=setTimeout(()=>finishWakeClip(false),WAKE_MAX_CLIP_MS);orb.setState('listening');}catch(_e){voiceVAD.endPcmCapture();wakeRecorder=null;}}
function stopWakeListener(){wakeActive=false;wakeRecoveryAttempts=0;if(wakeRecoveryTimer){clearTimeout(wakeRecoveryTimer);wakeRecoveryTimer=null;}finishWakeClip(true);voiceVAD.stop();document.title='ZENO Mini Orb · MIC OFF';}
voiceVAD.onSpeechStart(startWakeClip);voiceVAD.onSpeechEnd(detail=>{const discard=Boolean(detail&&detail.accepted===false);finishWakeClip(discard);if(discard)orb.setState('idle');});
voiceVAD.onLevel(rms=>{if(rms>0.008&&!miniAudioProved){miniAudioProved=true;void reportMiniMic('MICROPHONE_READY','Live audio received from Mini Orb.',true);}});
voiceVAD.onCaptureStopped(()=>{if(wakeActive){document.title='ZENO Mini Orb · MIC ERROR';void reportMiniMic('AUDIO_CAPTURE_FAILED','Mini Orb microphone stream ended unexpectedly.');stopWakeListener();if(wakeRecoveryAttempts<2){wakeRecoveryAttempts++;wakeRecoveryTimer=setTimeout(()=>{wakeRecoveryTimer=null;void startWakeListener();},900*wakeRecoveryAttempts);}}});
async function startWakeListener(){
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return false;
  wakeActive=true;
  await loadSpeechSettings();
  const capabilities=await voiceVAD.start({deviceId:selectedMicrophoneId()});
  if(!voiceVAD.mediaStream()){
    wakeActive=false;document.title='ZENO Mini Orb · MIC ERROR';
    void reportMiniMic(capabilities.error==='NotReadableError'?'MICROPHONE_BUSY':(capabilities.error==='NotAllowedError'?'WEBVIEW2_PERMISSION_DENIED':'DEVICE_INITIALIZATION_FAILED'),capabilities.error||'Microphone unavailable');
    // A hidden dashboard releases the same capture device through its SSE
    // lifecycle event. If this first handoff arrives slightly early, retry a
    // busy device at most twice; denied and missing-device errors stay final.
    if(capabilities.error==='NotReadableError'&&wakeRecoveryAttempts<2){
      wakeRecoveryAttempts++;wakeRecoveryTimer=setTimeout(()=>{wakeRecoveryTimer=null;if(!wakeActive)void startWakeListener();},1200);
    }
    return false;
  }
  wakeRecoveryAttempts=0;
  // The track settings are read by vad.js after opening the stream.  This
  // title is intentionally compact: it is a diagnostic, not a second UI.
  document.title=capabilities.noise_suppression?'ZENO Mini Orb · MIC LISTENING':'ZENO Mini Orb · MIC LISTENING (basic audio)';
  void reportMiniMic('MICROPHONE_READY','WebView2 microphone stream is open.',miniAudioProved);
  orb.setState('idle');
  return true;
}
// A saved WebView2 grant starts automatically. A brand-new profile requires
// the one security approval governed by Windows/WebView2; no prompt is made
// merely because the Mini Orb starts.
(async()=>{
  // A granted permission starts hands-free.  WebView2 builds that do not
  // expose the Permissions API still retain the same profile grant, so make
  // one normal getUserMedia attempt instead of silently disabling wake-word
  // listening forever.  A brand-new profile may show the single browser
  // security prompt; Windows privacy policy is never bypassed.
  try{
    if(navigator.permissions?.query){
      const status=await navigator.permissions.query({name:'microphone'});
      if(status.state==='denied'){document.title='ZENO Mini Orb · MIC ERROR';void reportMiniMic('WEBVIEW2_PERMISSION_DENIED','WebView2 microphone permission is denied.');return;}
      await startWakeListener();
      return;
    }
  }catch(_e){/* fall through: persisted WebView2 grants do not require query support */}
  await startWakeListener();
})();
window.zenoMiniWake={start:startWakeListener,stop:stopWakeListener};
window.addEventListener('beforeunload',()=>{if(agentEventSource)agentEventSource.close();agentPresence.dispose();stopWakeListener();});
</script></body></html>
