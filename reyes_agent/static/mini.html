<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZENO Mini Orb</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#dcecff;font:11px system-ui,sans-serif;cursor:grab;user-select:none}
  body.dragging{cursor:grabbing} #orb-simple{width:130px!important;height:130px!important} #orb-canvas{position:fixed;inset:0;width:100%;height:100%}
</style></head><body><canvas id="orb-canvas"></canvas>
<script type="module">
import { initOrb } from '/static/orb.js';
const orb=initOrb(document.getElementById('orb-canvas'));
function api(){return window.pywebview&&window.pywebview.api;}
function openDashboard(){const a=api();if(a&&a.show_dashboard)a.show_dashboard();else location.href='/';}
async function refresh(){
  try{const data=await(await fetch('/api/mini-status')).json(),task=data.task||{},progress=task.progress||{};
    const elapsed=task.run_ms?` · ${Math.floor(task.run_ms/1000)}s`:'';
    const agent=data.agents&&data.agents[0]?` · ${data.agents[0]}`:'';
    const text=task.name?`${task.name} · ${progress.stage||'working'}${elapsed}${agent}`:'ZENO · idle';
    orb.setState(task.name?'processing':'idle');
  }catch(e){orb.setState('error');}
}
refresh();setInterval(()=>{if(!document.hidden)refresh();},2000);
let dragging=false,moved=false,startX=0,startY=0,winX=0,winY=0,moveInFlight=false,queuedMove=null;
function flushMove(){
  if(moveInFlight||!queuedMove)return;
  const point=queuedMove;queuedMove=null;const a=api();
  if(!a||!a.move_window)return;
  moveInFlight=true;
  a.move_window(point.x,point.y).catch(()=>{}).finally(()=>{moveInFlight=false;if(queuedMove)requestAnimationFrame(flushMove);});
}
document.addEventListener('mousedown',e=>{const a=api();if(!a||!a.move_window)return;dragging=true;moved=false;startX=e.screenX;startY=e.screenY;const saved=JSON.parse(localStorage.getItem('zeno_orb_pos')||'null');winX=saved?saved.x:0;winY=saved?saved.y:0;document.body.classList.add('dragging');});
document.addEventListener('mousemove',e=>{if(!dragging)return;const dx=e.screenX-startX,dy=e.screenY-startY;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;queuedMove={x:winX+dx,y:winY+dy};requestAnimationFrame(flushMove);});
document.addEventListener('mouseup',()=>{if(!dragging)return;dragging=false;document.body.classList.remove('dragging');const a=api();if(a&&a.snap_orb)a.snap_orb().then(p=>{if(p&&p.ok)localStorage.setItem('zeno_orb_pos',JSON.stringify({x:p.x,y:p.y}));});});
document.addEventListener('click',()=>{if(!moved)openDashboard();});
window.addEventListener('pywebviewready',()=>{const saved=JSON.parse(localStorage.getItem('zeno_orb_pos')||'null'),a=api();if(saved&&a&&a.restore_orb_position)a.restore_orb_position(saved.x,saved.y);});
// One awaited heartbeat (max 4/s) proves that WebView messages are crossing
// into the Python host. It is never tied to animation frames and cannot
// accumulate bridge calls while the host is delayed.
setInterval(async()=>{const a=api();if(!document.hidden&&a&&a.host_heartbeat){try{await a.host_heartbeat(Date.now()/1000);}catch(_e){}}},250);
// The compact companion keeps the same wake behavior as the dashboard but
// does only one thing with it: wake ZENO by opening the full interface.
// Microphone permission is shared by this local origin, so an earlier grant
// carries over. A first-ever grant is still controlled by WebView2/Windows.
const WakeRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(WakeRecognition){
  const wake=new WakeRecognition();wake.continuous=true;wake.interimResults=false;wake.lang='en-US';
  let shouldListen=true;
  wake.onresult=e=>{const result=e.results[e.results.length-1];if(result&&result.isFinal&&/\b(?:wake up zeno|hey zeno|zeno)\b/i.test(result[0].transcript))openDashboard();};
  wake.onend=()=>{if(shouldListen)try{wake.start();}catch(_e){}};
  wake.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')shouldListen=false;};
  try{wake.start();}catch(_e){}
}
</script></body></html>
