async function startWakeListener(){
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return false;
  wakeActive=true;
  await loadSpeechSettings();
  const capabilities=await voiceVAD.start({deviceId:selectedMicrophoneId()});
  if(!voiceVAD.mediaStream()){
    wakeActive=false;document.title='ZENO Mini Orb · MIC ERROR';
    void reportMiniMic(capabilities.error==='NotReadableError'?'MICROPHONE_BUSY':(capabilities.error==='NotAllowedError'?'WEBVIEW2_PERMISSION_DENIED':'DEVICE_INITIALIZATION_FAILED'),capabilities.error||'Microphone unavailable');
    // A hidden dashboard releases the same capture device through its SSE
    // lifecycle event. If this first handoff arrives slightly early, retry a
    // busy device at most twice; denied and missing-device errors stay final.
    if(capabilities.error==='NotReadableError'&&wakeRecoveryAttempts<2){
      wakeRecoveryAttempts++;wakeRecoveryTimer=setTimeout(()=>{wakeRecoveryTimer=null;if(!wakeActive)void startWakeListener();},1200);
    }
    return false;
  }
  wakeRecoveryAttempts=0;
  void connectAudioFrameBus();
  // The track settings are read by vad.js after opening the stream.  This
  // title is intentionally compact: it is a diagnostic, not a second UI.
  document.title=capabilities.noise_suppression?'ZENO Mini Orb · MIC LISTENING':'ZENO Mini Orb · MIC LISTENING (basic audio)';
  void reportMiniMic('MICROPHONE_READY','WebView2 microphone stream is open.',miniAudioProved);
  orb.setState('idle');
  return true;
}
// A saved WebView2 grant starts automatically. A brand-new profile requires
// the one security approval governed by Windows/WebView2; no prompt is made
// merely because the Mini Orb starts.
(async()=>{
  // A granted permission starts hands-free.  WebView2 builds that do not
  // expose the Permissions API still retain the same profile grant, so make
  // one normal getUserMedia attempt instead of silently disabling wake-word
  // listening forever.  A brand-new profile may show the single browser
  // security prompt; Windows privacy policy is never bypassed.
  try{
    if(navigator.permissions?.query){
      const status=await navigator.permissions.query({name:'microphone'});
      if(status.state==='denied'){document.title='ZENO Mini Orb · MIC ERROR';void reportMiniMic('WEBVIEW2_PERMISSION_DENIED','WebView2 microphone permission is denied.');return;}
      await startWakeListener();
      return;
    }
  }catch(_e){/* fall through: persisted WebView2 grants do not require query support */}
  await startWakeListener();
})();
window.zenoMiniWake={start:startWakeListener,stop:stopWakeListener};
window.addEventListener('beforeunload',()=>{if(agentEventSource)agentEventSource.close();agentPresence.dispose();stopWakeListener();});
