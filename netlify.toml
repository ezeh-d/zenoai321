# ZENO public web surface.
#
# This deploys a static site plus ONE narrow function: the ZENO Anywhere
# rendezvous (/api/endpoint). That function stores a single string -- the
# current Cloudflare tunnel URL -- and can neither reach nor control the
# owner's computer. Writes need a shared secret; the URL must match the
# tunnel shape; reads are public (the login behind the URL is the gate). That
# is the whole server-side surface, and it exists only so the owner never has
# to remember a changing tunnel address.
#
# No secrets belong in this file. It is committed to git. ZENO_ANYWHERE_SECRET
# lives in Netlify's environment-variable UI, never here.

[build]
  publish = "web"
  command = "node scripts/build-config.js"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# The rendezvous, routed explicitly BEFORE the SPA catch-all so the greedy
# /* rewrite below cannot swallow it.
[[redirects]]
  from = "/api/endpoint"
  to = "/.netlify/functions/endpoint"
  status = 200

# Direct navigation to a nested route must serve the app rather than 404.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"

[[headers]]
  for = "/zeno-config.js"
  [headers.values]
    Cache-Control = "no-store"
