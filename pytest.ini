[pytest]
testpaths = tests
addopts = -p no:xonsh
# Root and archived test_*.py files are interactive legacy smoke scripts;
# several execute audio/model calls or sys.exit during import. The maintained,
# assertion-based ZENO suite lives in tests/.
# The optional xonsh distribution installs a global pytest plugin that creates
# an interactive Win32 prompt during pytest startup.  ZENO is normally launched
# console-free through pythonw/WebView2, where that plugin raises
# NoConsoleScreenBufferError before the first test is collected.  It is not a
# ZENO test dependency, so disable only that external plugin here.
